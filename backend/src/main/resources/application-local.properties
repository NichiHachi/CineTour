# Configuration pour développement local avec tunnel SSH

# MySQL via tunnel SSH (localhost:3307)
spring.datasource.url=jdbc:mysql://localhost:3307/cinetour
spring.datasource.username=dbuser
spring.datasource.password=dbpassword

# Neo4j via tunnel (localhost)
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=cinetour_neo4j_password

# Selenium (optionnel pour le dev local)
selenium.remote.url=http://localhost:4444/wd/hub
