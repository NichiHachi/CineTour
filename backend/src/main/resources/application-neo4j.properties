# Neo4j Specific Configuration Profile
spring.application.name=CineTour

# Neo4j Configuration
spring.neo4j.uri=bolt://neo4j:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=cinetour_neo4j_password

# Disable JPA auto-configuration for Neo4j profile if needed
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Logging for Neo4j
logging.level.org.neo4j.driver=INFO
logging.level.org.springframework.data.neo4j=DEBUG
