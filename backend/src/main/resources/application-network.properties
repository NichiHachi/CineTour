spring.application.name=CineTour
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${CINETOUR_NETWORK_DB_URL}
spring.datasource.username=${CINETOUR_NETWORK_DB_USER}
spring.datasource.password=${NETWORK_DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080

# HikariCP settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# Selenium
selenium.remote.url=http://localhost:4444

# Geocoding - LocationIQ API key (get one at https://locationiq.com - free 5000 req/day)
geocoding.locationiq.apikey=${LOCATIONIQ_API_KEY:}

# Logging SQL queries
logging.level.net.ttddyy.dsproxy.listener=debug

# Network DB password
network.db.password=${NETWORK_DB_PASSWORD:-}

# TMDB API Configuration
tmdb.api.token=${TMDB_API_TOKEN:}

# Neo4j configuration (via SSH tunnel)
spring.neo4j.uri=${SPRING_NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD}