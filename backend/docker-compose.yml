services:
  selenium-firefox:
    image: selenium/standalone-firefox:latest
    container_name: selenium-firefox
    ports:
      - "4444:4444"
    shm_size: 2gb
    environment:
      - SE_ENABLE_TRACING=false
  backend:
    container_name: cinetour-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9001:8080"
    volumes:
      - ./src:/cinetour_backend/src
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      selenium-firefox: 
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cinetour
      - SPRING_DATASOURCE_USERNAME=dbuser
      - SPRING_DATASOURCE_PASSWORD=dbpassword
      - SELENIUM_REMOTE_URL=http://selenium-firefox:4444/wd/hub
      - IMDB_DOWNLOAD_PATH=/cinetour_backend/imdb_data
      - TMDB_API_TOKEN=${TMDB_API_TOKEN:-}
      - JAVA_OPTS=-Xms2g -Xmx8g
  mysql:
    image: mysql:8.0
    container_name: cinetour-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cinetour
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    healthcheck:
      test: ["CMD", "mysql", "-u", "dbuser", "-pdbpassword", "-e", "USE cinetour;"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 20s
  neo4j:
    image: neo4j:5.15
    container_name: cinetour-neo4j
    restart: always
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/cinetour_neo4j_password
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
  neo4j-data:
  neo4j-logs:
